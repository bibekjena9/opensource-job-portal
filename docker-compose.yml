version: "3.9"
services:
  db:
    image: postgres:18.3-alpine3.22
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/18/
    networks:
      - opensource-job-portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: 
    - "8000:8000"
    env_file:
    - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - opensource-job-portal

networks:
  opensource-job-portal:
    driver: bridge

volumes:
  pgdata:
